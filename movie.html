<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Movie Details</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="details-container">
    <div class="poster-box">
        <img id="poster">
        <div class="badge" id="year"></div>
        <div class="badge" id="time"></div>
    </div>

    <div class="details-box">
        <h1 id="title"></h1>
        <p id="description"></p>
        <a id="youtube" target="_blank" class="yt-btn">Watch on YouTube</a>
    </div>
</div>

<script src="javascript/movie.js"></script>
</body>
</html>
